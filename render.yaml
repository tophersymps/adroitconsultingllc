# Render Blueprint — deploy the Next.js app without Vercel Pro (private org repos OK on Render free tier).
# Dashboard: New → Blueprint → connect this repo, or add a Web Service and point root to apps/web.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: adroit-web
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SALESFORCE_OID
        sync: false
      - key: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false
