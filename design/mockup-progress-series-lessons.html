<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adroit Learn — LessonCard Mark Complete (Mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #0B1D3A; --red: #C8102E;
    --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-300: #D1D5DB;
    --gray-400: #9CA3AF; --gray-500: #6B7280; --gray-800: #1F2937;
    --emerald: #10B981;
    --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
    --dur-micro: 120ms; --dur-std: 220ms; --dur-moment: 450ms;
    --ease-out: cubic-bezier(0.25, 1, 0.5, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: #F7F8FA; color: var(--gray-800); -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
  .sec-label { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.09em; margin: 36px 0 4px; }

  .lesson-row {
    display: flex; align-items: center; gap: 16px; padding: 16px 12px;
    border-bottom: 1px solid var(--gray-200); border-radius: 8px;
    transition: background var(--dur-micro) var(--ease-out);
    position: relative;
  }
  .lesson-row:hover { background: var(--gray-50); }
  .current-dot { position: absolute; left: -14px; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .badge { flex-shrink: 0; width: 56px; height: 40px; border-radius: 12px; background: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-mono); }
  .badge .num { font-size: 15px; font-weight: 700; line-height: 1; color: var(--red); }
  .badge .lbl { font-size: 7.5px; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.55); margin-top: 2px; }
  .badge.done { background: var(--gray-100); }
  .badge.done .num { color: var(--gray-400); }
  .badge.done .lbl { color: var(--gray-400); }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 15px; font-weight: 600; color: var(--gray-800); line-height: 1.4; }
  .title.done { color: var(--gray-400); }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--gray-400); margin-top: 4px; }
  .current-tag { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 0.06em; }

  /* Mark-complete toggle — 48px touch target */
  .complete-toggle {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid var(--gray-300); background: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: transparent;
    transition: all var(--dur-std) var(--ease-out);
  }
  .complete-toggle:hover { border-color: var(--emerald); }
  .complete-toggle.done {
    border-color: var(--emerald); background: var(--emerald); color: #fff;
    animation: check-pop var(--dur-moment) var(--ease-spring) both;
  }
  @keyframes check-pop { 0% { transform: scale(0.6); opacity:0; } 60% { transform: scale(1.08);} 100% { transform: scale(1); opacity:1; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; transform: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="sec-label">Lesson list — mark-complete states</div>

  <div style="border-top:1px solid var(--gray-200); margin-top:12px;">

    <!-- Completed lesson -->
    <div class="lesson-row">
      <div class="badge done"><span class="num">1</span><span class="lbl">Lesson</span></div>
      <div class="info">
        <div class="title done">Requirement 1: OmniScript Fundamentals</div>
        <div class="meta"><span>Aug 3, 2026</span></div>
      </div>
      <button class="complete-toggle done" aria-label="Mark lesson 1 incomplete">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>

    <!-- Current lesson — red dot indicator, uncompleted -->
    <div class="lesson-row">
      <span class="current-dot"></span>
      <div class="badge"><span class="num">2</span><span class="lbl">Lesson</span></div>
      <div class="info">
        <div class="title">Requirement 2: FlexCards &amp; DataRaptors</div>
        <div class="meta"><span>Aug 4, 2026</span><span class="current-tag">Current</span></div>
      </div>
      <button class="complete-toggle" aria-label="Mark lesson 2 complete"></button>
    </div>

    <!-- Future lesson, not started -->
    <div class="lesson-row">
      <div class="badge"><span class="num">3</span><span class="lbl">Lesson</span></div>
      <div class="info">
        <div class="title">Requirement 3: Integration Procedures</div>
        <div class="meta"><span>Aug 5, 2026</span></div>
      </div>
      <button class="complete-toggle" aria-label="Mark lesson 3 complete"></button>
    </div>

  </div>

</div>
</body>
</html>
